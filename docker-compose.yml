name: eaa-recruit

services:
  postgres:
    image: postgres:16-alpine
    container_name: eaa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recruitment}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eaa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: eaa-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-recruitment}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_SERVICE_URL:  http://ai-service:8000
      EXAM_ENGINE_URL: http://exam-engine:8090
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-min-256-bits-long-secret-key-12345}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  ollama:
    image: ollama/ollama
    container_name: eaa-ollama
    profiles: ["ollama"]  # only starts with: docker compose --profile ollama up -d
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  ai-service:
    build:
      context: ./ai-service
    container_name: eaa-ai-service
    environment:
      REDIS_URL: redis://redis:6379
      SPRING_CALLBACK_URL: http://backend:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      AI_SERVICE_PUBLIC_URL: ${AI_SERVICE_PUBLIC_URL:-http://ai-service:8000}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-recruitment}
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - hf_cache:/home/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  exam-engine:
    build:
      context: ./exam-engine
    container_name: eaa-exam-engine
    environment:
      PORT: "8090"
      REDIS_ADDR: redis:6379
      SPRING_BASE_URL: http://backend:8080
      AI_GRADING_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-min-256-bits-long-secret-key-12345}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"

  frontend:
    build:
      context: ./frontend
    container_name: eaa-frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  ollama_data:
  hf_cache:
